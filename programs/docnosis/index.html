<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>docnosis</title>
  <link rel="stylesheet" href="docnosis.css">
  <!-- The library is read from its sources rather than from "webodf.js": the
       validator of Relax NG is left out of the file that ships, as no viewer
       uses it, see "scripts/lib/sources.js". -->
  <script src="lib/runtime.js"></script>
  <script>
    runtime.libraryPaths = function () {
        return ["lib"];
    };
  </script>
  <script src="docnosis.js"></script>
  <script>
    window.addEventListener("load", function () {
        var docnosis = new Docnosis(document.getElementById("docnosis")),
            asked = /[?&]file=([^&]+)/.exec(window.location.search);
        if (asked) {
            docnosis.diagnose(decodeURIComponent(asked[1]));
        }
    }, false);
  </script>
</head>
<body>
  <h1>docnosis</h1>
  <p id="lead">Tells whether a document keeps to the OpenDocument standard: it
    is read against the schema of the version it names, from 1.0 to 1.4, as
    published by OASIS. The document is read in this page and goes nowhere:
    nothing is uploaded, and no server sees it.</p>
  <div id="docnosis"></div>
</body>
</html>
