// The viewer is a web view that shows a document with WebODF: no framework,
// no plugin, only the library and a page, both read from the assets. The
// library is copied there by cmake, see CMakeLists.txt.
plugins {
    id 'com.android.application' version '9.3.1'
}

android {
    namespace = 'org.webodf.viewer'
    compileSdk = 36

    defaultConfig {
        applicationId = 'org.webodf.viewer'
        // 24 is the oldest release androidx.webkit runs on, which it says
        // when the manifests are merged. The web view has been updated apart
        // from the system since 21, so it reads what the library needs on
        // every release from there anyway.
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = project.findProperty('webodfVersion') ?: '0.0.0'
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // Serves the assets and the cache over https, so that the page may read
    // the document with XMLHttpRequest.
    implementation = 'androidx.webkit:webkit:1.17.0'
}
