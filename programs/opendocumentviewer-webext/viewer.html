<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OpenDocument Viewer</title>
  <link rel="stylesheet" href="viewer.css">
  <script defer src="webodf.js"></script>
  <script defer src="viewer.js"></script>
</head>
<body>
  <!-- The commands sit in a menu rather than in a bar: a document is read far
       more often than it is saved, and a bar takes a line of every page it is
       shown above. -->
  <button id="menubutton" type="button" data-label="menu" title="Menu"
    aria-haspopup="true" aria-expanded="false" aria-controls="menu"
    aria-label="Menu"><span aria-hidden="true">&#9776;</span></button>
  <!-- The block is no role="menu": that role asks for entries of role
       "menuitem", and one of ours holds the input of a file, that a screen
       reader has to announce as what it is. A button that says what it opens
       is enough. -->
  <div id="menu" aria-labelledby="menubutton" hidden>
    <label class="entry" id="openlabel" data-message="openLocal">Open a local
      document<input type="file" id="open"
        accept=".odt,.fodt,.ott,.odp,.fodp,.otp,.ods,.fods,.ots">
    </label>
    <button class="entry" type="button" id="download"
      data-message="download">Save this document</button>
    <hr class="parting">
    <!-- How the pages are laid out: one under another as a document is
         scrolled, or two beside one another as a book is read, where the
         first page may face nothing of its own. -->
    <button class="entry" type="button" id="onepage"
      data-message="onePage">One page</button>
    <button class="entry" type="button" id="twopages"
      data-message="twoPages">Two pages</button>
    <button class="entry" type="button" id="twopagesright"
      data-message="twoPagesRight">Two pages, first on the right</button>
    <hr class="parting">
    <a class="entry" id="about" href="welcome.en.html"
      data-message="about">About this viewer</a>
  </div>
  <div id="odf"></div>
</body>
</html>
